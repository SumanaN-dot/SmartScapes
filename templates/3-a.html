<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/3-a.png') }}" alt = "Stairs to the third floor" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="up" alt="3-b" title="3-b" href="{{ url_for('three_b') }}" coords="1439,2546,2801,3620" shape="rect">
    <area target="_self" class="down" alt="" title="" href="javascript:void(0)" coords="3955,3618,4,5706" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
<script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "I've reached the stairwell.",
                "The stairs stretch downward, each step echoing in the empty space.",
                "I can continue down to the third floor from here.",
                "I should keep moving forward."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
