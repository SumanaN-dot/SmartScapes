<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/6.png') }}" alt="Hallway with staircase and fire exit door" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="up" alt="Fire Exit Door" title="Fire Exit Door" href="{{ url_for('seven') }}" coords="1938,1653,2585,3008" shape="rect">
</map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        function showInitialDialogue() {
            let newSentences = [
                "I turned left into a narrow corridor. There's a ladder on the right but the window seems locked",
                "Up ahead, a heavy wooden door blocks the way. An exit sign glows red above it.",
                "This must be a fire exit."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;

            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
