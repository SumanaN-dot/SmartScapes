<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/3-b.png') }}" alt = "Stairs to third floor lobby" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="up" alt="stairs" href="{{ url_for('four') }}" coords="101,12,4860,1309" shape="rect">
    <area target="_self" class="down" alt="" href="javascript:void(0)" coords="5687,4269,1,2730" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
<script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        function showInitialDialogue() {
            let newSentences = [
                "I'm making my way down the stairs now.",
                "Looking down, I can see the landing below with the metal railings on either side.",
                "The front desk is visible in the distance.",
                "Maybe I might find some clues there."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
