<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
   <!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/1-b.png') }}" alt="The fourth floor group study room" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="pointer" alt="Study room + dialogue" title="TV" href="{{ url_for('opening_premise') }}" coords="1897,1502,1068,968" shape="rect">
    <area target="_self" class="left door-link" alt="2" title="Exit Study Room" href="{{ url_for('two') }}" coords="208,2739,2,1143" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        // Hide the door link until the dialogue is over
        const doorArea = document.querySelector(".door-link");
        if (doorArea) {
            doorArea.style.opacity = "0.5";
            doorArea.style.pointerEvents = "none";
            doorArea.style.cursor = "not-allowed";
        }

        function showTVMessage() {
            let newSentences = [
                "The TV screen turns on with an unsettling message...",
                "'Human logic is flawed. Prove your intelligence. Solve my challenges to regain control.'",
                "What is happening? It feels like the security system has gone into lockdown.",
                "The system is challenging me. I need to prove my intelligence by solving its puzzles.",
                "Each room in this building holds a task. Solve them, and I regain freedom in time for the exam.",
                "I need to think carefully.",
                "Let's move forward and see what I am up against."
            ];
            addDialogue(newSentences);
            
            // Re-enable door after dialogue completes
            setTimeout(() => {
                doorArea.style.opacity = "1";
                doorArea.style.pointerEvents = "auto";
                doorArea.style.cursor = "pointer";
            }, newSentences.length * 1200); 
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            // Check if returning from TV screen
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('fromTV') === 'true') {
                showTVMessage();
                
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        window.onload = setup;
    </script>
</body>

</html>
