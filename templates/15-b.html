<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/15-b.png') }}" alt="ALT-TEXT" usemap="#image-map">

    <!-- THE HREFs FOR THE IMAGE MAP NEEDS TO BE CHANGED AT SOME POINT -->
    <!-- IT MIGHT BE EASIER TO DO THEM AFTER WE ADD ALL THE HTML FILES FIRST -->
    <!-- THE EXACT TEXT WILL DEPEND ON THE FUNCTION NAME IN THE FLASK FILE -->
    <map name="image-map">
        <area target="_self" alt="" title="" href="javascript:void(0)" coords="4029,3026,2,2" shape="rect">
    </map>
    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        console.log(status.checkedBulletinBoard);

        let checkedBulletin = localStorage.getItem("checkedBulletin");

        if (checkedBulletin) {
            dialogue = ["The elevator doors close behind you.",
                "You frantically push the third floor and the emergency buttons to no avail.",
                "A robotic voice calls out: 'You may not go up.'",
                "'So first, I'm not allowed to leave the building, and now I can't stay?'",
                "The voice states, 'Missing your exam is your punishment for being inconsiderate of other guests...'",
                "...and occupying a study room meant for groups.",
                "...",
                "'Why would you not just kick me out of the study room?'",
                "The voice doesn't respond, and you start to lose hope in escaping until you hearing static comming from the control panels.",
                "'Maybe I should check that out...'"
            ];
        } else {
            dialogue = ["The elevator doors close behind you.",
                "You frantically push the first floor and the emergency buttons to no avail.",
                "A robotic voice calls out: 'You may not leave the building.'",
                "'Missing your exam is your punishment for being inconsiderate of other guests...'",
                "...and occupying a study room meant for groups.",
                "...",
                "'Why would you not just kick me out of the study room?'",
                "The voice doesn't respond, and you start to lose hope in escaping until you hearing static comming from the control panels.",
                "'Maybe I should check that out...'"
            ];
        }

        function startPuzzle() {
            if (checkedBulletin) {
                let newSentences = ["A popup would appear here with double the questions (ASK NUPOOR)",
                    "for now, i'll just redirect you to 15-b"
                ];
            } else {
                let newSentences = ["A popup would appear here",
                "for now, i'll just redirect you to fifteen"    
            ];
            }
            addDialogue(newSentences);
        }

        let handler = {
            set(target, property, value, receiver) {
                if (property == "textIndex" &&
                    dialogue[target.dialogueIndex] == "for now, i'll just redirect you to fifteen"
                    && value == dialogue[target.dialogueIndex].length
                ) {
                    setTimeout(() => {
                        window.location.href = "{{ url_for('fifteen') }}";
                    }, 2500)
                } else if (property == "textIndex" &&
                    dialogue[target.dialogueIndex] == "for now, i'll just redirect you to 15-b") {
                    setTimeout(() => {
                        window.location.href = "{{ url_for('fifteen_b') }}";
                    }, 2500)
                }
                return target[property] = value;
            }
        };

        function setup() {
            proxy = new Proxy(textProps, handler);
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>

</html>
