<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/16.png') }}" alt="A WEPA printer blocks the MLC main exit"
        usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="pointer" title="WEPA Printer" href="javascript:void(0);" onclick="startPuzzle()"
            coords="421,631,109,71" shape="rect">
    </map>
    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        dialogue = ["You're so close to freedom.",
            "Unfortunately, a WEPA Printer is blocking your path."
        ];

        function startPuzzle() {
            let newSentences = ["This would have a popup with the questions",
                "At the end, there would be dialogue from the wepa or something",
                "For now, we'll redirect you to 18"
            ];
            addDialogue(newSentences);
        }

        let handler = {
            set(target, property, value, receiver) {
                if (property == "textIndex" &&
                    dialogue[target.dialogueIndex] == "For now, we'll redirect you to 18"
                    && value == dialogue[target.dialogueIndex].length
                ) {
                    setTimeout(() => {
                        window.location.href = "{{ url_for('eighteen') }}";
                    }, 2500)
                }
                return target[property] = value;
            }
        };

        function setup() {
            proxy = new Proxy(textProps, handler);
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>

</html>
