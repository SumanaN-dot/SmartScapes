<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/13-l-with-janitor.png') }}" alt="Image of hallway to elevators"
        usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="pointer" alt="Janitorial Device" title="Janitorial Cleaning Device(?)"
            href="javascript:void(0)" onclick="showObstacle()" coords="295,137,441,312" shape="rect">
        <area target="_self" class="right" alt="Restrooms" title="Restrooms" href="javascript:void(0)"
            onclick="showRestroom()" coords="534,91,572,337" shape="rect">
        <area target="_self" class="left" alt="Elevators" title="Elevators" href="{{ url_for('fourteen') }}"
            coords="105,48,225,132,228,309,146,375,149,310,112,302" shape="poly">
        <area target="_self" class="down" alt="Back" title="Back" href="javascript:void(0)" onclick="showReturn()"
            coords="3,431,572,494" shape="rect">
    </map>
    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        dialogue = ["A sound comes from the elevator lobby."];

        function showObstacle() {
            let newSentences = ["The floor sweeper(?) is blocking the other side of the floor."];
            addDialogue(newSentences);
        }

        function showRestroom() {
            let newSentences = ["There's nothing interesting in the restrooms."];
            addDialogue(newSentences);
        }

        function showReturn() {
            "There was noise coming from the elevators.",
            "Maybe I should check that out first."
        }

        function setup() {
            proxy = proxyText;
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>

</html>
