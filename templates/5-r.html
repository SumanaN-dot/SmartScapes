<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="{{ url_for('static', filename='images/5-r.png') }}" alt="Engagement center hallway" usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="left" alt="Left" title="Left" href="{{ url_for('five_right_left') }}" coords="30,1461,1694,2858"
            shape="rect">
        <area target="_self" class="right" alt="Right" title="Right" href="{{ url_for('five_right_right') }}"
            coords="1953,838,2451,3237" shape="rect">
    </map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "I've turned right and entered a narrower side corridor.",
                "The hallway is quieter here, with a door visible at the end.",
                "There are paths branching off to the left and right.",
                "I should check both directions to find a way out."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
