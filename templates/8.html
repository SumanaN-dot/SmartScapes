<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/8.png') }}" alt="Room with study carrels and desks" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="left" alt="Left" title="Left" href="{{ url_for('eight_left') }}" coords="0,2,1664,3020" shape="rect">
    <area target="_self" class="right" alt="Right" title="Right" href="{{ url_for('eight_right') }}" coords="2440,13,4032,3015" shape="rect">
</map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        function showInitialDialogue() {
            let newSentences = [
                "The fire exit door led to another study area.",
                "I can go left or right from here. I wonder which way leads out."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;

            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
