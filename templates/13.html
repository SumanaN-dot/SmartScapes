<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/13.png') }}" alt="Jittery Joe's Cafe" usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="left" alt="Back" title="Back" href="{{ url_for('twelve') }}" coords="3,23,748,4070" shape="rect">
        <area target="_self" class="right" alt="Right" title="Right" href="{{ url_for('thirteen_right') }}"coords="5418,4062,4728,9" shape="rect">
        <area target="_self" class="pointer" alt="tv" title="Tv" href="javascript:void(0)" onclick="startPuzzle()" coords="3138,1477,3921,1857,3642,1656" shape="0">
        <area target="_self" class="pointer" alt="tv" title="Tv" href="javascript:void(0)" onclick="startPuzzle()" coords="4297,1469,5104,1902" shape="rect">
    </map>
<div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        dialogue = ["You've reached Jittery Joe's.",
            "It's locked up still, but you hear static from the tv."
        ];

        function startPuzzle() {
            let newSentences = ["This would have a pop up that shows the quiz questions.",
                "After completing the puzzle, there would be a button that would redirect you to the next page",
                "But for now, just navigate to /fourteen in the url"
            ];
            addDialogue(newSentences);
        }

        function setup() {
            proxy = proxyText;
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>
</html>
