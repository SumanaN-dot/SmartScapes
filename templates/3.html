<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/3.png') }}" alt = "Start of fourth floor stairs" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="up" alt="" title="Stairs" href="{{ url_for('three_a') }}" coords="2702,1726,1367,1491" shape="rect">
    <area target="_self" class="up" alt="" title="Stairs" href="{{ url_for('three_a') }}" coords="3137,1415,3425,1750" shape="rect">
    <area target="_self" class="up" alt="" title="Stairs" href="{{ url_for('three_a') }}" coords="615,1415,943,1707,2,6,252,10" shape="rect">
    <area target="_self" class="left" alt="" href="{{ url_for('three_l') }}" coords="2,-2,351,3019" shape="rect">
    <area target="_self" class="right" alt="Right" href="{{ url_for('three_r') }}" coords="3650,5,4027,3007" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
<script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "This is the main lobby on the fourth floor.",
                "The space feels larger than the other floors, with high ceilings and pillars.",
                "I can see stairs on both sides leading up to the third floor.",
                "Those stairs might lead me closer to finding a way out."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
