                "There's a hallway to the left. It looks like it leads somewhere deeper into the building."

            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            showInitialDialogue();
