<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/3-l.png') }}" alt = "Blocked hallway" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="down" alt="Floor Scrubber" title="Back" href="{{ url_for('three') }}?fromLeft=true" coords="0,388,735,552" shape="rect">
    <area target="_self" class="pointer" alt="3-r"  title="Floor Scrubber" href="javascript:void(0)" onclick="showObstacle()" coords="280,247,423,371" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
<script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "I've taken the left corridor from the main lobby.",
                "The hallway stretches ahead with pillars lining both sides.",
                "Wait... there's something in the middle of the hallway.",
                "It looks like a floor scrubber is blocking the path forward."
            ];
            addDialogue(newSentences);
        }

        function showObstacle() {
            let newSentences = [
                "The industrial floor scrubber is sitting right in the center of the hallway.",
                "It's completely blocking my path forward.",
                "I can't move it - it's too heavy.",
                "I'll need to find another way around. Let me go back."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
