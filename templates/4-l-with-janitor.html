<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/4-l-with-janitor.png') }}" alt = "Blocked hallway" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="pointer" alt="Floor Scrubber" title="Floor Scrubber" href="javascript:void(0)" onclick="showObstacle()" coords="271,220,371,346" shape="rect">
    <area target="_self" class="down" alt="Back" title="Back" href="{{ url_for('four') }}" coords="0,401,660,498" shape="rect">
</map>

<div id="textbox"></div>

<script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
<script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "I've entered the East Wing corridor.",
                "Wait, I can see an EXIT sign up ahead! Finally, a way out!",
                "But... there's that floor scrubber again, blocking the middle of the hallway.",
                "I need to find a way past it or move it somehow."
            ];
            addDialogue(newSentences);
        }

        function showObstacle() {
            let newSentences = [
                "The floor scrubber is just sitting here, right in my path to the exit.",
                "It's too heavy for me to push by myself.",
                "Let's try the other side of the hallway.",
                
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
