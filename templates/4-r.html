<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="{{ url_for('static', filename='images/4-r.png') }}" alt="Hallway of the third floor" usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="up" alt="Creative Engagement Wing" title="Creative Engagement Wing"
            href="{{ url_for('five_with_wepa') }}" coords="2435,1493,3437,2261" shape="rect">
        <area target="_self" class="down" alt="Back" title="Back" href="{{ url_for('four') }}"
            coords="48,3645,5704,4254" shape="rect">
    </map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        function showInitialDialogue() {
            let newSentences = [
                "I've entered the Engagement Wing to the right.",
                "The hallway looks clear - no floor scrubbers blocking this path!",
                "I can see an EXIT sign ahead. This might be a better route.",
                "Let me continue forward and see where this leads."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
            
            
            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
