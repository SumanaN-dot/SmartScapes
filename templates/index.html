<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
        }

        img {
            margin: 0;
            width: 100vw;
            height: 100vh;
        }

        #consent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color:#2b2d46;
            background-color: #9593a7;
            border: 3px solid #2b2d46;
            padding: 5px;
            text-align: center;
        }

        #controls {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25vw;
            background-color: #2b2d46d0;
        }

        #controls > * {
            width: 100%;
        }

        #controls button {
            padding: 0.25em;
        }

        .trapezoid {
            border-bottom: 1em solid #9593a7;
            border-left: 1em solid transparent;
            border-right: 1em solid transparent;
            height: 0;
        }

        .upside-down {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/index.png') }}" alt="Outside of MLC" usemap="#image-map">

    <div id="consent">
        <h1> Research Consent </h1>
        <p> This should be a description of our project, the data we will collect, and how we will use said data.</p>
        <button onclick="acceptConsent()">Accept</button>
    </div>

    <div id="controls">
        <div class="trapezoid"></div>
        <button onclick="goTo1b()"> PLAY </button>
        <button onclick="about()"> ABOUT </button>
        <button onclick="showTips()"> HOW TO PLAY</button>
        <div class="trapezoid upside-down"></div>
    </div>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        const consent = document.getElementById("consent");
        const controls = document.getElementById("controls");

        function acceptConsent() {
            consent.style.display = "none";
            showControls();
        }

        function showControls() {
            controls.style.display = "flex";
            controls.style.flexDirection = "column";
            controls.style.alignItems = "center";
            controls.style.gap = "3vh";
        }

        function goTo1b() {
            // THIS SHOULD BE REPLACED WITH FIRST_B AT SOME POINT
            window.location.href = "{{ url_for('fourteen')}}";
        }

        function about() {
            let newSentences = ["This should be a project description!"];
            addDialogue(newSentences);
        }

        function showTips() {
            let newSentences = ["Hover your mouse around the screen and look for clickable elements.",
                "Make sure to read the textboxes!"
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;
        }

        window.onload = setup;
    </script>
</body>

</html>
