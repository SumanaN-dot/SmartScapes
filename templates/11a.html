<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    <img src="{{ url_for('static', filename='images/11a.png') }}" alt="Hallway to Jittery Joe's" usemap="#image-map">
    
    <map name="image-map">
        <area target="_self" class="left" title="Stairs" alt="Stairs" href="javascript:void(0)" onclick="showStairs()" coords="2,2335,1087,1977,1058,1172,2,958" shape="poly">
        <area target="_self" class="right" title="Study area" alt="Study area" href="javascript:void(0)" onclick="showStudy()" coords="4029,2438,3031,1818,3025,1137,4023,873,4029,2265" shape="poly">
        <area target="_self" class="up" title="Hallway to Jittery Joe's" alt="11b" href="{{ url_for('eleven_b') }}" coords="1767,1233,2523,1862" shape="rect">
        <area target="_self" class="down" title="Back" alt="Back" href="javascript:void(0)" onclick="showBack()" coords="20,2562,4011,3007" shape="rect">
    </map>
    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();
        
        dialogue = ["Halfway there!"];

        function showStairs() {
            let newSentences = ["Jittery Joe's is on this floor..."];
            addDialogue(newSentences);
        }

        function showStudy() {
            let newSentences = ["'Now's not really the time for studying...'"];
            addDialogue(newSentences);
        }

        function showBack() {
            let newSentences = ["'Going back would just take me father from where I need to go.'"];
            addDialogue(newSentences);
        }

        function setup() {
            proxy = proxyText;
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>

</html>
