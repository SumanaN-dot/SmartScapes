<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <img src="{{ url_for('static', filename='images/14-r.png') }}" alt="ALT-TEXT" usemap="#image-map">
    
    <!-- THE HREFs FOR THE IMAGE MAP NEEDS TO BE CHANGED AT SOME POINT -->
    <!-- IT MIGHT BE EASIER TO DO THEM AFTER WE ADD ALL THE HTML FILES FIRST -->
    <!-- THE EXACT TEXT WILL DEPEND ON THE FUNCTION NAME IN THE FLASK FILE -->
    <map name="image-map">
        <area target="_self" alt="Bulletin Board" href="javascript:void(0)" onclick="showBulletin()" coords="959,491,5388,3475" shape="rect">
        <area target="_self" alt="Wall 14" href="{{ url_for('fourteen') }}" coords="3,5,5707,5,5691,4255,5421,3666,5429,433,853,427,820,3576,5364,3568,5658,4279,3,4247,3,3494,3,3241,3,492" shape="poly">
    </map>
    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        dialogue = ["The bulletin board has a lot of cool events listed."];

        function showBulletin() {
            checkedBulletinBoard = true;
            let newSentences = [ "Painting without puppies at 7:30pm Poultry Science 014",
                "Summoning Circle 3:00am at Driftmier Woods",
                "Computer Science Mass Exam at 8:00am MLC 350",
                "Huh? Now that you think of it, your exam was "
            ];
            addDialogue(newSentences);
        }

        function setup() {
            proxy = proxyText;
            proxy.dialogueIndex = -1;
            proxy.textIndex = 0;
            handleTextbox();
        }

        window.onload = setup;
    </script>
</body>

</html>
