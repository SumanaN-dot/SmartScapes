    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->

    <!-- IT MIGHT BE EASIER TO DO THEM AFTER WE ADD ALL THE HTML FILES FIRST -->
    <!-- THE EXACT TEXT WILL DEPEND ON THE FUNCTION NAME IN THE FLASK FILE -->

        <area target="_self" alt="Bulletin Board" title="Bulletin Board" href="" coords="959,491,5388,3475" shape="rect">
        <area target="_self" alt="Wall 14" title="Wall 14" href="" coords="3,5,5707,5,5691,4255,5421,3666,5429,433,853,427,820,3576,5364,3568,5658,4279,3,4247,3,3494,3,3241,3,492" shape="poly">

    <script src="{{ url_for('static', filename='js/imageMapResizer.min.js') }}"> </script>

        imageMapResize();

</body>
