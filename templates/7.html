<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->
    
<!-- Image Map Generated by http://www.image-map.net/ -->
<img src="{{ url_for('static', filename='images/7.png') }}" alt="Stairwell with caution sign and door at bottom" usemap="#image-map">

<map name="image-map">
    <area target="_self" class="up" alt="Door at bottom of stairs" title="Door at bottom of stairs" href="{{ url_for('eight') }}" coords="1859,594,3686,2628" shape="rect">
</map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        function showInitialDialogue() {
            let newSentences = [
                "I pushed through the fire exit and found myself at the top of a stairwell.",
                "There's a door at the bottom of the stairs.",
                "I should go check it out."
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;

            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
