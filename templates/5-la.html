<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScapes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>

<body>
    <!-- IMPORTANT NOTE: MAKE SURE TO ADD ALT TEXT TO THE img TAG -->
    <!-- GENERATED BY THE IMAGE MAP GENERATOR. OTHERWISE, IT WON'T WORK -->
    <!-- WHEN WE RUN THE PAGE IN FLASK -->

    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="{{ url_for('static', filename='images/5-la.png') }}" alt="Engagement center lobby" usemap="#image-map">

    <map name="image-map">
        <area target="_self" class="left" alt="Entrance to the Stairs" title="Entrance to the Stairs" href="{{ url_for('six') }}" coords="1583,3013,0,11"
            shape="rect">
    </map>

    <div id="textbox"></div>

    <script src="{{ url_for('static', filename='imageMapResizer.min.js') }}"> </script>
    <script src="{{ url_for('static', filename='script.js') }}"> </script>
    <script>
        imageMapResize();

        function showInitialDialogue() {
            let newSentences = [
                "I walked further down the hallway. The walls are bare and the carpet stretches on.",
                "To my left, there's an opening that leads to a stairwell.",
                "I should head there and see if it leads to an exit."
                
            ];
            addDialogue(newSentences);
        }

        closeTextbox();

        function setup() {
            textProps.dialogueIndex = -1;
            textProps.textIndex = 0;
            dialogue = [];
            proxy = proxyText;

            showInitialDialogue();
        }

        window.onload = setup;
    </script>

</body>

</html>
